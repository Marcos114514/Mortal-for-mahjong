[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mortal_play"
version = "0.1.0"
description = "Gameplay backend for the Mortal mahjong AI: FastAPI + WebSocket + libriichi rules engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "toml",
    "tqdm",
]

[project.scripts]
mortal-play = "mortal_play.api.server:run_from_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mortal_play"]

[tool.hatch.build.targets.sdist]
include = ["src/mortal_play"]
